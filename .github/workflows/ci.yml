name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Compile
        run: python -m compileall -q scripts/
      - name: Lint
        run: |
          python -m pip install --quiet ruff
          ruff check scripts/

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shellcheck
        run: shellcheck install-so2.sh .github/check-pin.sh

  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # check-pin.sh diffs HEAD against the pinned commit, so it needs the
          # history, not the default single-commit checkout.
          fetch-depth: 0
      - name: The installer pin must cover the code it installs
        run: bash .github/check-pin.sh
