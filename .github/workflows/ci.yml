name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Compile
        run: python -m compileall -q scripts/
      - name: Lint
        run: |
          python -m pip install --quiet ruff
          ruff check scripts/

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck install-so2.sh .github/check-pin.sh

  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-pin.sh diffs HEAD against the pinned commit, so it needs the
          # history, not the default single-commit checkout.
          fetch-depth: 0
      - name: The installer pin must cover the code it installs
        run: bash .github/check-pin.sh
