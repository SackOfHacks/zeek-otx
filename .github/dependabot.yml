# Dependabot keeps the two things this repository pins from going stale
# silently: the single Python dependency, and the Actions used by CI.
#
# Note that this does NOT cover OTX_REV in install-so2.sh -- that pin points at
# this repository's own history and is enforced by .github/check-pin.sh.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Only move the floor when the current constraint genuinely excludes the new
    # version. The default ("increase") raises `>=` floors on every upstream
    # release, which here means proposing a bump nothing needs: the script uses
    # only requests.get(headers=, params=, timeout=) and RequestException, all
    # far below the current floor. Worse, it fights the advice three lines up in
    # requirements.txt -- Ubuntu 22.04 ships python3-requests 2.25.1 and 24.04
    # ships 2.31.0, so a raised floor pushes sensor operators off the distro
    # package (which unattended-upgrades patches) and onto a pip install that
    # shadows it. Security updates still raise the floor when they have to.
    versioning-strategy: increase-if-necessary

  # The workflow pins actions by commit SHA, so without this the pins would
  # never move and would quietly rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
