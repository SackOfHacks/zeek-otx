# zeek-otx configuration.
#
# This file holds your OTX API key. Keep it mode 0600 and owned by the account
# that runs zeek-otx.py, and never commit a filled-in copy to a repository.
# Every field below is documented in the README under "Configuration".

[otx]

# Your AlienVault OTX API key, from https://otx.alienvault.com/api
api_key =

# How far back to ask the API for modified pulses, in whole days. Each run
# rewrites the whole feed, so this is the size of the feed, not an increment.
days_of_history = 90

# Where the generated Zeek Intel file is written. The installer rewrites this
# to the platform-appropriate path; the directory must already exist.
outfile = otx.dat

# Value of the meta.do_notice column, which tells Zeek's Intel framework
# whether a match should raise a notice. 'T' or 'F'.
do_notice = T

# Optional. Octal mode for the generated Intel file; defaults to 0640 so the
# list of indicators the sensor watches for is not world-readable. Widen it
# only if the process that consumes the feed cannot otherwise open it.
# outfile_mode = 0640
